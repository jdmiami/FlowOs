name: iPhone unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Core tests
        run: swiftc FlowOS/Models.swift FlowOS/FlowSchema.swift FlowOS/CloudSchema.swift Tests/main.swift -o /tmp/flow-tests && /tmp/flow-tests
      - name: Compile physical iPhone app
        run: |
          set -o pipefail
          xcodebuild -project FlowOS.xcodeproj -scheme FlowOS -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/FlowOS.app
          test -f "$APP/Info.plist"
          mkdir -p staging/Payload
          ditto "$APP" staging/Payload/FlowOS.app
          test -d staging/Payload/FlowOS.app/PlugIns/FlowWidgets.appex
          (cd staging && zip -qry ../FlowOS-LiveActivities-unsigned.ipa Payload)
          rm -rf staging/Payload/FlowOS.app/PlugIns
          /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities false" staging/Payload/FlowOS.app/Info.plist
          (cd staging && zip -qry ../FlowOS-unsigned.ipa Payload)
          unzip -t FlowOS-unsigned.ipa
          unzip -t FlowOS-LiveActivities-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FlowOS-unsigned-IPA
          path: FlowOS-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FlowOS-LiveActivities-unsigned-IPA
          path: FlowOS-LiveActivities-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowOS-build-log
          path: build.log
          if-no-files-found: ignore
