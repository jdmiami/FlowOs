name: FlowOS
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.20.0
targets:
  FlowOS:
    type: application
    platform: iOS
    sources: [FlowOS]
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowos.personal
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.2.1'
        CURRENT_PROJECT_VERSION: '2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Create events you approve.
        INFOPLIST_KEY_NSContactsUsageDescription: Find contacts for calls you request.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
