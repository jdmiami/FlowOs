name: FlowOS
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.20.0
targets:
  FlowOS:
    type: application
    platform: iOS
    sources:
      - FlowOS
      - Shared
      - path: BonsaiResources
        buildPhase: resources
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - framework: Vendor/CLiteRT.xcframework
        embed: true
        codeSign: true
      - target: FlowWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowos.personal
        SWIFT_OBJC_BRIDGING_HEADER: FlowOS/Bonsai/Bridging.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/FlowOS/Bonsai"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.5.5'
        CURRENT_PROJECT_VERSION: '10'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Create events you approve.
        INFOPLIST_KEY_NSContactsUsageDescription: Find contacts for calls you request.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  FlowWidgets:
    type: app-extension
    platform: iOS
    sources: [FlowWidgets, Shared]
    info:
      path: FlowWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowos.personal.widgets
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.5.5'
        CURRENT_PROJECT_VERSION: '10'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
